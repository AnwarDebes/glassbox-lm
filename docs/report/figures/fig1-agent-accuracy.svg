<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 403" width="680" height="403" role="img" aria-labelledby="fig1-title fig1-desc" font-family="'Noto Sans', Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-kerning: none; word-spacing: 0.6px">
<title id="fig1-title">Readable agent minus each reference: accuracy difference on the test split</title>
<desc id="fig1-desc">Forest plot. Nine rows in three groups: the readable agent minus the transformer-encoder agent, minus the prompted local LLM, and minus the fine-tuned transformer, on STAR, ABCD and MultiWOZ 2.2, each with its 95% interval and, where a non-inferiority rule exists, its registered margin. Rule NI2, with a margin of 2 points against LLM*, is met on STAR and ABCD and not on MultiWOZ.</desc>
<rect x="0" y="0" width="680" height="403" fill="#ffffff"/>
<text x="14.0" y="20.0" font-size="12.5" font-weight="700" fill="#0b0b0b">Readable agent minus each reference: accuracy difference on the test split</text>
<text x="14.0" y="36.0" font-size="10" fill="#52514e">Points. Dot: difference; line: 95% interval; short bar: registered non-inferiority margin.</text>
<text x="14.0" y="49.0" font-size="10" fill="#52514e">Right of 0 the readable agent is ahead. A non-inferiority rule is met when the line stays right of the bar.</text>
<text x="14.0" y="62.0" font-size="10" fill="#52514e">Rule NI2, with a margin of 2 points against LLM*, is met on STAR and ABCD and not on MultiWOZ.</text>
<text x="14.0" y="95.0" font-size="10" fill="#52514e">minus the transformer-encoder agent (bge-large-en-v1.5, run per decision)</text>
<text x="666.0" y="95.0" font-size="10" text-anchor="end" fill="#52514e">rules R22.3, R23.1, R24.1: met</text>
