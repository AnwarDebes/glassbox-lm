<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" role="img" aria-labelledby="fig4-title fig4-desc" font-family="'Noto Sans', Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-kerning: none; word-spacing: 0.6px">
<title id="fig4-title">Wikipedia test pairs (E5): test AUC on the three data versions</title>
<desc id="fig4-desc">Three dot plots side by side, one per data version (sa, np, ns_all). Rows: the stock model in its registered setting, the OR-group rule in the vote sum, word overlap, tf-idf cosine, PPMI cosine and the logistic regression. The OR-group rule (arm TB, chosen on DEV) is above the stock model in its registered setting by +0.091, +0.101 and +0.098 AUC of the vote sum, as predicted from DEV; this is not a comparison at matched size or cost. The references carry no rule, and the picture is not a ranking: under each open mark stands the vote sum minus that reference with its paired article bootstrap interval. The vote sum minus PPMI cosine has its interval below 0 on all three versions, and minus the logistic regression on sa and np. Minus word overlap the interval is above 0 on sa in the printed interval and with the seeds resampled, and includes 0 there in two further readings; on np it includes 0. Minus tf-idf cosine the interval includes 0 on sa and is below 0 on np. On ns_all word overlap and tf-idf cosine are not a comparison, by construction.</desc>
<rect x="0" y="0" width="680" height="366" fill="#ffffff"/>
<text x="14.0" y="20.0" font-size="12.5" font-weight="700" fill="#0b0b0b">Wikipedia test pairs (E5): test AUC on the three data versions</text>
<text x="14.0" y="36.0" font-size="10" fill="#52514e">Filled marks: the registered comparison (rules met, as predicted from DEV), mean of 5 seeds each, with its</text>
<text x="14.0" y="49.0" font-size="10" fill="#52514e">difference. Open marks: references with no rule. AUC 0.5 is chance. Not a comparison at matched size or cost.</text>
<text x="14.0" y="62.0" font-size="10" fill="#52514e">Under each open mark: the vote sum minus that reference with its paired article bootstrap interval (95%), a</text>
<text x="14.0" y="75.0" font-size="10" fill="#52514e">reading with no rule; the picture is not a ranking. On sa the interval against word overlap includes 0 in two</text>
<text x="14.0" y="88.0" font-size="10" fill="#52514e">further readings (articles of both paragraphs resampled; without the pairs that touch the listed articles).</text>
