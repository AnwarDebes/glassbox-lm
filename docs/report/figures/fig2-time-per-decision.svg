<title id="fig2-title">Time per decision on a log scale: the readable agent, the references and LLM*</title>
<desc id="fig2-desc">Dot plot on a logarithmic time axis from 0.1 ms to 100 s. One row per system, one dot per dataset (STAR, ABCD, MultiWOZ 2.2). The readable agent takes 0.50 to 2.98 ms on one CPU thread; LLM* takes 10.6 to 11.63 s on a V100 GPU.</desc>
