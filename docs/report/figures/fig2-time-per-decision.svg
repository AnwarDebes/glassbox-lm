<text x="14.0" y="36.0" font-size="10" fill="#52514e">One dot per dataset; rough timings from one shared workstation.</text>
<text x="14.0" y="49.0" font-size="10" fill="#52514e">Blue: the readable agent. Filled grey: LLM*, the other system of the registered comparison. Open: references beside it.</text>
