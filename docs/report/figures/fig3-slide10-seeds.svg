<title id="fig3-title">Slide 10 with direct labels (E3): the bars of Check 2b, seed by seed</title>
<desc id="fig3-desc">Slide 10 with direct labels (E3), a different model from the one that study 2 (hierarchical_tm) tested: the best single clause meets the bars of Check 2b on 5 of 5 registered seeds, on 8 of 20 further seeds and on 13 of 25 pooled. A strip of 25 squares shows the seeds one by one; of the seeds without both flags of the scorer, ten have the flag of the 288 view only and two have neither. Below, the share of seeds with both flags and its exact 95% interval for the three sets of seeds.</desc>
