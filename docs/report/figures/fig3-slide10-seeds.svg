<text x="14.0" y="20.0" font-size="12.5" font-weight="700" fill="#0b0b0b">Slide 10 with direct labels (E3): the bars of Check 2b, seed by seed</text>
<text x="14.0" y="36.0" font-size="10" fill="#52514e">One square per model seed: does the best single clause meet the bars? A different model from the one</text>
<text x="14.0" y="49.0" font-size="10" fill="#52514e">that study 2 (hierarchical_tm) tested. The registered seeds carry the rule of E3; the 20 further seeds carry</text>
<text x="14.0" y="62.0" font-size="10" fill="#52514e">no rule. The three counts are never read without each other. The model as a whole is template-like on 0 of 25 seeds.</text>
